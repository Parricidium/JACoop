# JACoop: compile check on every push. The mod is Jedi Academy single player
# on Windows (x64): the same three targets as a local build (engine, game,
# vanilla renderer); no Jedi Outcast, no multiplayer. Nothing is attached to
# the releases: a JACoop release is a zip made by the mod's packaging (engine,
# pk3, launcher), not bare engine binaries.
name: build

on:
  workflow_dispatch:
  push:
    branches: [coop-gfx]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
      - "jacoop/**"
  pull_request:
    branches: [coop-gfx]

jobs:
  windows:
    name: Windows x86_64 Release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBuildSPEngine=ON -DBuildSPGame=ON -DBuildSPRdVanilla=ON
          -DBuildJK2SPEngine=OFF -DBuildJK2SPGame=OFF -DBuildJK2SPRdVanilla=OFF
          -DBuildMPEngine=OFF -DBuildMPGame=OFF -DBuildMPCGame=OFF -DBuildMPUI=OFF
          -DBuildMPRdVanilla=OFF -DBuildMPRend2=OFF -DBuildMPDed=OFF
          -DBuildPortableVersion=OFF -DBuildTests=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: JACoop-engine-windows-x86_64
          path: |
            build/Release/openjk_sp.x86_64.exe
            build/Release/rdsp-vanilla_x86_64.dll
            build/Release/jagamex86_64.dll
